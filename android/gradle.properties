android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Keep the build light on the PC:
# - modest heap for the Gradle daemon
# - compile Kotlin inside the Gradle process (no second Kotlin daemon JVM)
# - the daemon shuts itself down after 10 idle minutes instead of 3 hours
org.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=4
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
